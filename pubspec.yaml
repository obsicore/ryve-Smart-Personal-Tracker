name: hybrid_tracker
description: Ryve — rhythm your life · thrive every day
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local DB
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.30

  # Remote DB / HTTP
  dio: ^5.8.0+1

  # Auth (local, no Firebase)
  crypto: ^3.0.6

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  rive: ^0.13.0

  # Charts
  fl_chart: ^0.70.2

  # Fonts
  google_fonts: ^6.2.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Storage
  shared_preferences: ^2.3.5

  # SVG rendering
  flutter_svg: ^2.0.17

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0
  path_provider: ^2.1.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  drift_dev: ^2.23.1
  freezed: ^3.0.0
  json_serializable: ^6.9.4

  # Icons / Splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  image_path: "assets/logo/ryve_mark.svg"
  adaptive_icon_background: "#0D1F17"

flutter_native_splash:
  color: "#0D1F17"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/animations/
    - assets/illustrations/

